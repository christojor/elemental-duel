apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-config
  namespace: elemental-duel
data:
  PORT: "5001"
  BATTLE_API_URL: "http://battle-api:8080"
  ANALYTICS_DB_PATH: "/data/analytics.db"
  BACKUP_TARGET: "render-placeholder-storage"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analytics-data-pvc
  namespace: elemental-duel
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: elemental-duel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
    spec:
      containers:
        - name: analytics-api
          image: protodoc/elemental-duel:analytics-latest
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: analytics-config
          volumeMounts:
            - name: analytics-data
              mountPath: /data
      volumes:
        - name: analytics-data
          persistentVolumeClaim:
            claimName: analytics-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: elemental-duel
spec:
  selector:
    app: analytics-api
  ports:
    - port: 5001
      targetPort: 5001
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: analytics-backup
  namespace: elemental-duel
spec:
  schedule: "30 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: upload
              image: amazon/aws-cli:latest
              command: ["/bin/sh", "-c"]
              args:
                - >
                  aws s3 cp /data/analytics.db
                  s3://$S3_BUCKET/analytics-backups/analytics-$(date +%F-%H%M%S).db
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: AWS_DEFAULT_REGION
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: S3_BUCKET
              volumeMounts:
                - name: analytics-data
                  mountPath: /data
          volumes:
            - name: analytics-data
              persistentVolumeClaim:
                claimName: analytics-data-pvc
