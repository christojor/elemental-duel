apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: elemental-duel
data:
  PORT: "5000"
  BATTLE_API_URL: "http://battle-api:8080"
  ANALYTICS_API_URL: "http://analytics-api:5001"
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secret
  namespace: elemental-duel
type: Opaque
stringData:
  FLASK_SECRET_KEY: dev-secret-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: elemental-duel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: protodoc/elemental-duel:frontend-latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: PORT
            - name: BATTLE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: BATTLE_API_URL
            - name: ANALYTICS_API_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: ANALYTICS_API_URL
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: FLASK_SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: elemental-duel
spec:
  type: LoadBalancer   # On EKS this provisions an AWS ELB; locally use kubectl port-forward
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 5000
