# Template for AWS credentials used by the S3 backup CronJobs.
# 1. Copy this file: cp k8s/aws-credentials.example.yml k8s/aws-credentials.yml
# 2. Fill in your values in k8s/aws-credentials.yml
# 3. Apply: kubectl apply -f k8s/aws-credentials.yml
#
# k8s/aws-credentials.yml is gitignored so real credentials are never committed.
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: elemental-duel
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_DEFAULT_REGION: "eu-north-1"
  S3_BUCKET: "REPLACE_ME"
